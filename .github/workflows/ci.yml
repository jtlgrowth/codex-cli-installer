name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Smoke tests
        run: bash test/smoke.sh

  powershell:
    name: powershell (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "install.ps1 parses"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $bad = 0
          foreach ($f in @('./install.ps1')) {
            $results = Invoke-ScriptAnalyzer -Path $f -Severity Error,Warning `
              -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingInvokeExpression
            if ($results) { Write-Host "findings in $f"; $results | Format-Table -AutoSize | Out-String | Write-Host; $bad++ }
          }
          if ($bad) { exit 1 }
          Write-Host "PSScriptAnalyzer clean"

      - name: Dry run exits 0
        shell: pwsh
        env:
          CXI_DRY_RUN: '1'
          CXI_YES: '1'
        run: |
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "dry run exited $LASTEXITCODE"; exit 1 }

      # The skills are private now. An old copied command must still exit 0
      # and print the notice, not fail on the flag.
      - name: An old --skills command still runs and prints the notice
        shell: pwsh
        run: |
          $out = ./install.ps1 -DryRun -Yes -Skills hire *>&1 | Out-String
          if ($out -notmatch 'does not install skills') { Write-Error "-Skills did not print the notice"; exit 1 }
          $env:CXI_SKILLS = 'hire,setup'
          $out = ./install.ps1 -DryRun -Yes *>&1 | Out-String
          if ($out -notmatch 'does not install skills') { Write-Error "CXI_SKILLS did not print the notice"; exit 1 }
          Write-Host "old skill commands print the notice"
          exit 0

      # The cmd.exe form documented in the README, run through a real cmd.exe.
      # A quoting mistake here is invisible from pwsh - cmd has its own rules for
      # quotes and for the pipe - and would only surface on a student's machine.
      - name: The Command Prompt one-liner parses in cmd.exe
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$env:CXI_SKILLS='hire,setup'; $env:CXI_DRY_RUN='1'; $env:CXI_YES='1'; ./install.ps1"
          if errorlevel 1 exit /b 1

      - name: Install for real
        shell: pwsh
        run: |
          $env:CXI_YES = '1'
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "install exited $LASTEXITCODE"; exit 1 }

      # A student's next step: a NEW window finds codex in PowerShell and in cmd.
      # PATH is rebuilt from the registry, which is what a new window does.
      - name: A new window finds codex (PowerShell and cmd)
        shell: pwsh
        run: |
          function New-Window { $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User') }
          New-Window
          $cv = (codex --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { Write-Error "codex not found from a new window: $cv"; exit 1 }
          $mv = (cmd /c "codex --version" 2>&1 | Out-String).Trim()
          if ($mv -ne $cv) { Write-Error "codex in cmd printed '$mv', PowerShell printed '$cv'"; exit 1 }
          Write-Host "new window: $cv in PowerShell and cmd"
          exit 0

      - name: Re-running is safe
        shell: pwsh
        run: |
          $env:CXI_YES = '1'
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "re-run exited $LASTEXITCODE"; exit 1 }
          exit 0

  install-linux:
    name: real install (ubuntu container)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Bootstrap curl
        run: apt-get update && apt-get install -y curl ca-certificates sudo

      - uses: actions/checkout@v5

      - name: Install for real
        env:
          CXI_YES: '1'
        run: bash install.sh

      - name: Verify Codex is on PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          codex --version

      - name: Re-run must be idempotent
        env:
          CXI_YES: '1'
        run: |
          before=$(grep -c 'codex-cli-installer' "$HOME/.bashrc" || true)
          bash install.sh
          after=$(grep -c 'codex-cli-installer' "$HOME/.bashrc" || true)
          echo "marker count: $before -> $after"
          [ "$before" = "$after" ] || { echo "shell rc grew on re-run"; exit 1; }
